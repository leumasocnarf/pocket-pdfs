services:
  postgres-prod:
    image: "postgres:18-alpine"
    container_name: "pocket-pdfs-prod-db"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
    volumes:
      - "pocket_pdfs_prod_data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prod-db-network

  app-prod:
    image: ${AWS_ECR}/pocket-pdfs/backend:prod
    platform: linux/amd64
    container_name: "pocket-pdfs-prod-app"
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prod-app-network
      - prod-db-network

  frontend-prod:
    image: ${AWS_ECR}/pocket-pdfs/frontend:prod
    platform: linux/amd64
    container_name: "pocket-pdfs-prod-frontend"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      app-prod:
        condition: service_healthy
    networks:
      - prod-app-network

volumes:
  pocket_pdfs_prod_data:

networks:
  prod-db-network:
    driver: bridge
  prod-app-network:
    driver: bridge
