services:
  postgres-staging:
    image: "postgres:18-alpine"
    container_name: "pocket-pdfs-staging-db"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME}"
    volumes:
      - "pocket_pdfs_staging_data:/var/lib/postgresql/data"
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-db-network

  app-staging:
    image: ${AWS_ECR}/pocket-pdfs/backend:staging
    platform: linux/amd64
    container_name: "pocket-pdfs-staging-app"
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: "staging"
    depends_on:
      postgres-staging:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - staging-app-network
      - staging-db-network

  frontend-staging:
    image: ${AWS_ECR}/pocket-pdfs/frontend:staging
    platform: linux/amd64
    container_name: "pocket-pdfs-staging-frontend"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:80"
    depends_on:
      app-staging:
        condition: service_healthy
    networks:
      - staging-app-network

volumes:
  pocket_pdfs_staging_data:

networks:
  staging-db-network:
    driver: bridge
  staging-app-network:
    driver: bridge