name: Deploy Production

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: prod-${{ github.sha }}

jobs:
  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          docker buildx build --platform linux/amd64 \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_BACKEND_REPO }}:prod \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_BACKEND_REPO }}:${{ env.IMAGE_TAG }} \
            --push ./backendCR_REGISTRY }}/${{ secrets.ECR_BACKEND_REPO }}:prod \
            --push ./backend

  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }} \
            --build-arg VITE_ENVIRONMENT=production \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_FRONTEND_REPO }}:prod \
            -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_FRONTEND_REPO }}:${{ env.IMAGE_TAG }} \
            --push ./frontend

  deploy:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/pocket-pdfs-key.pem
          chmod 400 ~/.ssh/pocket-pdfs-key.pem
          echo "${{ secrets.EC2_HOST_FINGERPRINT }}" >> ~/.ssh/known_hosts

      - name: Copy config files to EC2
        run: |
          scp -i ~/.ssh/pocket-pdfs-key.pem \
            infra/prod/compose.yaml \
            infra/prod/nginx.conf \
            ec2-user@${{ secrets.EC2_HOST }}:/opt/pocket-pdfs/prod/

      - name: Create .env file on EC2
        run: |
          ssh -i ~/.ssh/pocket-pdfs-key.pem \
            ec2-user@${{ secrets.EC2_HOST }} \
            "cat > /opt/pocket-pdfs/prod/.env <<'ENVEOF'
          DB_NAME=${{ secrets.PROD_DB_NAME }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          DB_HOST=postgres-prod
          DB_PORT=5432
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRATION_MS=${{ secrets.PROD_JWT_EXPIRATION_MS }}
          ADMIN_USERNAME=${{ secrets.PROD_ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.PROD_ADMIN_PASSWORD }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET=${{ secrets.S3_BUCKET_NAME }}
          AWS_S3_PREFIX=${{ secrets.PROD_S3_PREFIX }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ECR=${{ secrets.ECR_REGISTRY }}
          CORS_ALLOWED_ORIGINS=http://${{ secrets.EC2_HOST }}
          SPRING_SENTRY_DSN=${{ secrets.SENTRY_DSN_BACKEND }}
          ENVEOF"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/pocket-pdfs-key.pem \
            ec2-user@${{ secrets.EC2_HOST }} \
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }} \
              && cd /opt/pocket-pdfs/prod \
              && docker compose pull \
              && docker compose up -d"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/pocket-pdfs-key.pem

