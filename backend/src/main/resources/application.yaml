server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: backend
  output:
    ansi:
      enabled: always
  shutdown: graceful
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SPRING_SENTRY_DSN}
  send-default-pii: true