server:
  port: 8080

spring:
  application:
    name: backend
  output:
    ansi:
      enabled: always
  shutdown: graceful

  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production-min-256-bits}
    expiration-ms: 86400000 # 24 hours
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}