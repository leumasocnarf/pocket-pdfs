services:
  postgres:
    image: 'postgres:18-alpine'
    container_name: 'db-pockets-pdf'
    environment:
      POSTGRES_DB: 'mydatabase'
      POSTGRES_PASSWORD: 'secret'
      POSTGRES_USER: 'myuser'
    volumes:
      - 'pocket_pdfs_data:/var/lib/postgresql/data'
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U myuser -d mydatabase' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pocket_pdfs_data: